[project]
name = "bocc-linkedin-events"
version = "0.1.0"
description = "Create the weekly Buffalo Open Coffee Club LinkedIn event via the LinkedIn Event Management API"
readme = "README.md"
requires-python = ">=3.12"
# Standard library only at runtime: nothing to pin, nothing to audit beyond CPython.
dependencies = []

[project.scripts]
bocc-event = "bocc_events.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["uv_build==0.11.7"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "bocc_events"

[tool.pytest.ini_options]
testpaths = ["tests"]
