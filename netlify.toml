# Unified Netlify configuration for the BOCC monorepo.
# A single Netlify site serves BOTH the Astro website (static, plus the
# on-demand routes in the adapter's SSR function: the admin app, /events/* and
# /sitemap.xml, rendered from Neon and cached at the CDN, ADR 0009) and the
# backend Netlify Functions (API), so the API is same-origin with the site
# (https://716coffee.club/.netlify/functions/...) and no CORS is required.

[build]
  # The repo root is the build base and the Astro project root (ADR 0007): the
  # Netlify adapter added in Phase 2 writes .netlify/v1 under the Astro root, and
  # Netlify only reads it from the base.
  base = ""
  command = "npm run build"
  publish = "dist"
  # `dev` and `main` build only from the build hook the "Migrate and deploy" workflow
  # calls after migrating Neon (issue #32, docs/backend/DEPLOYS.md).
  ignore = "sh scripts/netlify-ignore.sh"

[build.environment]
  # Astro 7 needs Node >= 22.23.4. 24 is the current LTS (20 went end-of-life in April 2026).
  NODE_VERSION = "24"
  ASTRO_TELEMETRY_DISABLED = "1"

# Serverless functions (formerly the separate bocc-backend site).
# Node deps (pg) are installed from the root package.json.
[functions]
  directory = "backend/netlify/functions"
  node_bundler = "esbuild"

# Redirect www to apex.
[[redirects]]
  from = "https://www.716coffee.club/*"
  to = "https://716coffee.club/:splat"
  status = 301

# Security headers for all static assets and pages. Function responses don't get
# these: the on-demand public pages (/events/*, /sitemap.xml) set them themselves
# (src/lib/site/http.mjs), the admin routes in src/middleware.ts.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

# Admin app (ADR 0008): never indexed. The on-demand routes also send these (and a
# CSP and no-store) from src/middleware.ts; these rules cover anything static.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/login*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
